services:
  postgres:
    image: postgres:16
    container_name: tempest-postgres
    environment:
      POSTGRES_DB: tempest
      POSTGRES_USER: tempest
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempest -d tempest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
